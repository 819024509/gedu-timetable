<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEDU 教师课表</title>
    <link rel="stylesheet" href="./vendor/tailwind.css">
    <script src="./vendor/react.min.js"></script>
    <script src="./vendor/react-dom.min.js"></script>
    <script src="./vendor/html2canvas.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        .calendar-grid {
            display: grid;
            grid-template-columns: 80px repeat(var(--days), minmax(150px, 1fr));
        }
        .icon-wrapper { display: inline-flex; align-items: center; justify-content: center; width: 1.5rem; height: 1.5rem; }
        .icon-wrapper-sm { display: inline-flex; align-items: center; justify-content: center; width: 1rem; height: 1rem; }
        
        .exporting-mode { width: fit-content !important; height: auto !important; overflow: visible !important; }
        .exporting-mode .event-card { height: auto !important; min-height: 80px; overflow: visible !important; }
        .exporting-mode .event-title { white-space: normal !important; overflow: visible !important; display: block !important; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

        <script src="./vendor/app.js"></script>
</body>
</html>
